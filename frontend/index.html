<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF0EC" />
    <meta
      name="description"
      content="Kuski Digital: café orgánico, superalimentos, textiles de alpaca y artesanía de comunidades productoras de Cusco."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear el primer pintado (display=swap). Unbounded solo en 500–600.
         Las aplica el script en línea que inyecta vite.config.js (cargarFuentes): un onload="…"
         en línea lo bloquearía la Content-Security-Policy de vercel.json. -->
    <link
      rel="preload"
      as="style"
      data-fuentes
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Unbounded:wght@500..600&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Unbounded:wght@500..600&display=swap"
      />
    </noscript>
    <title>Kuski Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
